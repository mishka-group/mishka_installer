name: Mix Dependency Submission

# Sends the Mix dependency graph (mix.lock) to GitHub's dependency graph on every push to master, so
# Dependabot alerts cover Hex packages. It can be started by hand from the Actions tab as well.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          # TEMPORARY pin: OTP >= 29.0.6 limits httpc response headers to 10240 bytes and
          # GitHub's release redirect sends ~10.8 KB. Move back to the latest OTP once GitHub
          # shrinks that header or the download libraries pass max_header_size.
          otp-version: "29.0.5"

      - name: Submit Mix dependencies
        uses: erlef/mix-dependency-submission@v1.3.5
        with:
          install-deps: true
