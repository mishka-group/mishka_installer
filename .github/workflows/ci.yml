name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Switch to @ci-v1 once mishka-group/mishka_cms#77 is merged and tagged.
    uses: mishka-group/mishka_cms/.github/workflows/mishka-ci.yml@ci-v1
    with:
      # Today CI runs format, compile warnings, `mix deps.audit` and the tests; Credo, Sobelow, Dialyzer and ExDNA are not run.
      elixir: 1.20.5-otp-29
      otp: 29.1.2
      versions: '[{"elixir":"1.17.1","otp":"27.0"}]'
      credo: false
      dialyzer: false
      ex_dna: false
      test-args: --trace
      # The tests read PROJECT_PATH and write under deployment/test/extensions.
      pre-test: |
        echo "PROJECT_PATH=$(pwd)" >> "$GITHUB_ENV"
        mkdir -p "$(pwd)/deployment/test/extensions"
      # The :distributed tests start peer nodes through EPMD and are excluded from `mix test`.
      extra-checks: |
        epmd -daemon
        PROJECT_PATH="$(pwd)" mix test --only distributed --trace
